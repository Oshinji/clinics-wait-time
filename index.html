<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みがわ町整形外科クリニック - 待ち時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
:root {
  --navy:       #1b5e3f;
  --navy-dark:  #0f3d28;
  --blue:       #4caf7a;
  --green:      #2d7a52;
  --green-bg:   #e9f5ef;
  --amber:      #b86e1a;
  --amber-bg:   #fef3e2;
  --red:        #b83a3a;
  --red-bg:     #fbe9e9;
  --gray:       #6b7280;
  --gray-bg:    #f3f4f6;
  --ink:        #111827;
  --ink-soft:   #374151;
  --bg:         #eef7f2;
  --white:      #ffffff;
  --border:     #a8d5bb;
  --border-lt:  #d3ecdb;
}

/* ── Page title ── */
.page-title .accent {
  font-size: 1.25em;
  color: var(--amber);
  font-weight: 900;
  background: linear-gradient(transparent 65%, rgba(184,110,26,0.22) 65%);
  padding: 0 2px;
  letter-spacing: 0.02em;
}

/* 待ち時間の大数字表示 */
.hero-label {
  font-size: 16px;
  color: var(--gray);
  margin-bottom: 10px;
  letter-spacing: 0.04em;
}
.hero-number-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
  margin-bottom: 12px;
}
.hero-number {
  font-family: 'Inter', sans-serif;
  font-size: 110px;
  font-weight: 900;
  color: var(--navy-dark);
  letter-spacing: -0.04em;
  line-height: 1;
}
.hero-unit {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 40px;
  font-weight: 700;
  color: var(--navy-dark);
  line-height: 1;
  padding-bottom: 10px;
}
/* 「分以上」表記時は3文字あるので少し小さめに */
.hero-unit.over { font-size: 32px; }

/* お待ちなし */
.no-wait-big {
  font-size: 36px;
  font-weight: 700;
  color: var(--green);
  line-height: 1.5;
  margin-bottom: 8px;
}
.no-wait-sub {
  font-size: 16px;
  color: var(--gray);
}

/* ── Responsive (ページ固有) ── */
@media (max-width: 480px) {
  .hero-number { font-size: 92px; }
  .hero-unit { font-size: 34px; }
  .hero-unit.over { font-size: 28px; }
  .no-wait-big { font-size: 29px; }
}
</style>
</head>
<body>

<main class="card">
  <header class="header">
    <div class="clinic-name">みがわ町整形外科クリニック</div>
    <div class="header-line"></div>
  </header>

  <div class="page-title-wrap">
    <h1 class="page-title"><span class="accent">予約なし</span>の方の<br>待ち時間</h1>
    <div class="update-badge">
      <span class="live-dot"></span>
      <span id="updated">更新 --:--</span>
    </div>
  </div>

  <div id="content" aria-live="polite"><div class="loading">読み込み中…</div></div>

  <footer class="footer">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
      style="flex-shrink:0;margin-top:1px">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
    </svg>
    <span>表示は目安です。診察内容により待ち時間が前後する場合があります。</span>
  </footer>
</main>

<script src="common.js"></script>
<script>
(function(){
  var toMin      = ClinicCommon.toMin;
  var jstParts   = ClinicCommon.jstParts;
  var hoursHtml  = ClinicCommon.hoursHtml;
  var setContent = ClinicCommon.setContent;

  function getSession(){
    var p = jstParts();
    var w = p.w, n = p.h * 60 + p.m;
    var pmEnd    = (w===6) ? toMin('16:00') : toMin('17:00');
    var pmEndStr = (w===6) ? '16:00' : '17:00';
    var ctx = { pmEndStr: pmEndStr };
    if(w===0||w===4)         return {t:'hol', ctx:ctx};
    if(n<toMin('08:30'))     return {t:'pre', ctx:ctx};
    if(n<toMin('11:30'))     return {t:'open', half:'am', ctx:ctx};
    if(n<toMin('14:30'))     return {t:'lun', ctx:ctx};
    if(n<pmEnd)              return {t:'open', half:'pm', ctx:ctx};
    return {t:'aft', ctx:ctx};
  }

  function render(data){
    var s  = getSession();
    var el = document.getElementById('content');
    var h  = '';

    if(data && data.error){
      h = '<div class="hero">'
        +'<div class="status-badge off">情報を取得できませんでした</div>'
        +'<div class="state-big">しばらくしてから<br>再度ご確認ください</div>'
        +'</div>';
      setContent(el, h + hoursHtml(s));
      return;
    }

    // 祝日・臨時休診: クライアント時刻のセッション判定より優先
    if(data && data.is_holiday){
      h = '<div class="hero">'
        +'<div class="status-badge off">休診日</div>'
        +'<div class="state-big">本日は休診日です</div>'
        +'<div class="state-resume-note">またのご来院をお待ちしております</div>'
        +'</div>';
      setContent(el, h + hoursHtml(s));
      return;
    }

    switch(s.t){
      case 'hol':
        h = '<div class="hero">'
          +'<div class="status-badge off">休診日</div>'
          +'<div class="state-big">本日は休診日です</div>'
          +'<div class="state-resume-note">診療は月・火・水・金・土曜日に行っております</div>'
          +'</div>';
        break;

      case 'pre':
        h = '<div class="hero">'
          +'<div class="status-badge busy">受付開始前</div>'
          +'<div class="state-resume-label">午前の受付開始</div>'
          +'<div class="state-resume-time">8:30</div>'
          +'<div class="state-resume-note">から受付を開始します</div>'
          +'</div>';
        break;

      case 'lun':
        // 11:30〜14:30: 受付時間外。「本日終了」と誤読されないよう「午前の」を明示。
        h = '<div class="hero">'
          +'<div class="status-badge busy">午前の受付終了</div>'
          +'<div class="state-big">午前の受付は<br>終了いたしました</div>'
          +'</div>';
        break;

      case 'aft':
        h = '<div class="hero">'
          +'<div class="status-badge off">受付終了</div>'
          +'<div class="state-big">本日の受付は<br>終了しました</div>'
          +'<div class="state-resume-note">またのご来院をお待ちしております</div>'
          +'</div>';
        break;

      case 'open':
        // is_open は scraper 取得時刻のフラグで最大5分のラグがある。
        // 8:30 / 14:30 直後の境界では scraper の更新が間に合わず
        // is_open=false のままになることがあるため、
        // その場合は「情報取得中」表示にして "受付時間外" や
        // "お待ちなし" の誤表示を避ける（混雑状況不明と分かるように）。
        if(!data || !data.is_open){
          h = '<div class="hero">'
            +'<div class="status-badge busy">受付中</div>'
            +'<div class="state-big">最新の待ち時間を<br>取得しています</div>'
            +'<div class="state-resume-note">しばらくお待ちください</div>'
            +'</div>';
        } else if(!data.estimated_minutes){
          // is_open=true で estimated_minutes が 0 または未定義 → 真にお待ちなし
          // （直来0でも予約や診察中で estimated>0 なら待ち時間を表示する）
          h = '<div class="hero">'
            +'<div class="status-badge open">受付中</div>'
            +'<div class="no-wait-big">お待ちの方は<br>いません</div>'
            +'<div class="no-wait-sub">比較的スムーズにご案内できます</div>'
            +'</div>';
        } else {
          // 150分を超える場合は「150分以上」表記（具体的な分数の不安感を抑制）
          var isOverMax = data.estimated_minutes > 150;
          var displayNum  = isOverMax ? 150 : data.estimated_minutes;
          var displayUnit = isOverMax ? '分以上' : '分';
          h = '<div class="hero">'
            +'<div class="status-badge busy">受付中</div>'
            +'<div class="hero-label">目安の待ち時間</div>'
            +'<div class="hero-number-row">'
            +'<span class="hero-number">'+displayNum+'</span>'
            +'<span class="hero-unit'+(isOverMax ? ' over' : '')+'">'+displayUnit+'</span>'
            +'</div>'
            +'<div class="hero-desc">程度お待ちいただきます</div>'
            +'</div>';
        }
        break;

      default:
        h = '<div class="hero"><div class="status-badge off">受付時間外です</div></div>';
    }

    setContent(el, h + hoursHtml(s));
  }

  ClinicCommon.startPolling(render);
})();
</script>
</body>
</html>
