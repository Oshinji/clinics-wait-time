<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みがわ町整形外科クリニック - 待ち時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy:       #1b5e3f;
  --navy-dark:  #0f3d28;
  --blue:       #4caf7a;
  --green:      #2d7a52;
  --green-bg:   #e9f5ef;
  --amber:      #b86e1a;
  --amber-bg:   #fef3e2;
  --red:        #b83a3a;
  --red-bg:     #fbe9e9;
  --gray:       #6b7280;
  --gray-bg:    #f3f4f6;
  --ink:        #111827;
  --ink-soft:   #374151;
  --bg:         #eef7f2;
  --white:      #ffffff;
  --border:     #a8d5bb;
  --border-lt:  #d3ecdb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 100%;
  max-width: 560px;
  background: var(--white);
  border-radius: 20px;
  box-shadow: 0 2px 8px rgba(30,90,140,.08), 0 12px 40px rgba(30,90,140,.10);
  overflow: hidden;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, var(--navy-dark), var(--navy));
  padding: 22px 28px 16px;
}
.clinic-name {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.04em;
  line-height: 1.4;
}
.header-line {
  height: 3px;
  background: linear-gradient(90deg, var(--blue), #a8d4f0);
  margin-top: 14px;
  border-radius: 2px;
}

/* ── Page title ── */
.page-title-wrap {
  padding: 24px 28px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.page-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--navy);
  border-left: 5px solid var(--blue);
  padding-left: 14px;
  line-height: 1.4;
  letter-spacing: 0.01em;
}
.page-title .accent {
  font-size: 1.25em;
  color: var(--amber);
  font-weight: 900;
  background: linear-gradient(transparent 65%, rgba(184,110,26,0.22) 65%);
  padding: 0 2px;
  letter-spacing: 0.02em;
}
.update-badge {
  font-size: 11px;
  color: var(--gray);
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  padding-top: 6px;
  white-space: nowrap;
}
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--blue);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ── Hero ── */
.hero {
  padding: 32px 28px 28px;
  text-align: center;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  padding: 9px 22px;
  border-radius: 100px;
  margin-bottom: 26px;
  letter-spacing: 0.06em;
}
.status-badge::before {
  content: '';
  width: 9px; height: 9px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.status-badge.open  { background: var(--green-bg); color: var(--green); }
.status-badge.busy  { background: var(--amber-bg); color: var(--amber); }
.status-badge.off   { background: var(--gray-bg);  color: var(--gray); }

/* 待ち時間の大数字表示 */
.hero-label {
  font-size: 16px;
  color: var(--gray);
  margin-bottom: 10px;
  letter-spacing: 0.04em;
}
.hero-number-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
  margin-bottom: 12px;
}
.hero-number {
  font-family: 'Inter', sans-serif;
  font-size: 110px;
  font-weight: 900;
  color: var(--navy-dark);
  letter-spacing: -0.04em;
  line-height: 1;
}
.hero-unit {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 40px;
  font-weight: 700;
  color: var(--navy-dark);
  line-height: 1;
  padding-bottom: 10px;
}
/* 「分以上」表記時は3文字あるので少し小さめに */
.hero-unit.over { font-size: 32px; }
.hero-desc {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink-soft);
  line-height: 1.4;
}

/* お待ちなし */
.no-wait-big {
  font-size: 36px;
  font-weight: 700;
  color: var(--green);
  line-height: 1.5;
  margin-bottom: 8px;
}
.no-wait-sub {
  font-size: 16px;
  color: var(--gray);
}

/* 休診・昼休み等のステート */
.state-big {
  font-size: 30px;
  font-weight: 700;
  color: var(--ink-soft);
  line-height: 1.6;
  margin-bottom: 16px;
}
.state-resume-label {
  font-size: 15px;
  color: var(--gray);
  margin-bottom: 6px;
}
.state-resume-time {
  font-family: 'Inter', sans-serif;
  font-size: 80px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.02em;
  line-height: 1;
  margin-bottom: 8px;
}
.state-resume-note {
  font-size: 15px;
  color: var(--gray);
  line-height: 1.6;
}

/* ── Hours ── */
.hours {
  margin: 0 28px 24px;
  border-top: 1px solid var(--border-lt);
  padding-top: 16px;
}
.hours-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray);
  margin-bottom: 10px;
}
.hours-rows { display: flex; gap: 8px; }
.hours-row {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  background: var(--gray-bg);
  border: 1px solid var(--border-lt);
  border-radius: 8px;
  font-size: 14px;
  color: var(--gray);
}
.hours-row.is-current {
  background: #e8f3fb;
  border-color: var(--border);
  color: var(--navy);
  font-weight: 600;
}
.hours-period { font-size: 13px; flex-shrink: 0; }
.hours-time {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  letter-spacing: 0.01em;
}

/* ── Footer ── */
.footer {
  padding: 14px 28px 20px;
  border-top: 1px solid #e5e7eb;
  background: #f8fafc;
  font-size: 11px;
  color: var(--gray);
  line-height: 1.6;
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

/* ── Loading ── */
.loading {
  padding: 60px 28px;
  text-align: center;
  color: var(--gray);
  font-size: 14px;
}

/* ── Responsive ── */
@media (max-width: 480px) {
  body { padding: 0; background: var(--white); }
  .card { border-radius: 0; box-shadow: none; min-height: 100vh; }
  .header { padding: 18px 20px 14px; }
  .clinic-name { font-size: 15px; }
  .page-title-wrap { padding: 20px 20px 0; flex-direction: column; gap: 8px; }
  .page-title { font-size: 22px; }
  .hero { padding: 26px 20px 22px; }
  .hero-number { font-size: 92px; }
  .hero-unit { font-size: 34px; }
  .hero-unit.over { font-size: 28px; }
  .hero-desc { font-size: 19px; }
  .no-wait-big { font-size: 29px; }
  .state-big { font-size: 25px; }
  .state-resume-time { font-size: 68px; }
  .hours { margin: 0 20px 20px; }
  .footer { padding: 12px 20px 18px; }
}
</style>
</head>
<body>

<main class="card">
  <header class="header">
    <div class="clinic-name">みがわ町整形外科クリニック</div>
    <div class="header-line"></div>
  </header>

  <div class="page-title-wrap">
    <h1 class="page-title"><span class="accent">予約なし</span>の方の<br>待ち時間</h1>
    <div class="update-badge">
      <span class="live-dot"></span>
      <span id="updated">更新 --:--</span>
    </div>
  </div>

  <div id="content"><div class="loading">読み込み中…</div></div>

  <footer class="footer">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
      style="flex-shrink:0;margin-top:1px">
      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
    </svg>
    <span>表示は目安です。診察内容により待ち時間が前後する場合があります。</span>
  </footer>
</main>

<script>
(function(){
  var DATA_URL = "https://raw.githubusercontent.com/Oshinji/clinics-wait-time/main/data/status.json";
  var INTERVAL  = 5 * 60 * 1000;

  function toMin(s){ var p=s.split(':'); return +p[0]*60+ +p[1]; }

  // JST (UTC+9 固定, 夏時間なし) の時刻部品を安全に取り出す。
  // toLocaleString + new Date() は Safari/iOS が narrow no-break space (U+202F)
  // を挿入する既知不具合があり Invalid Date になる → UTC+9h ms 加算で回避。
  function jstParts(epochMs){
    var t = (typeof epochMs === 'number') ? epochMs : new Date().getTime();
    var j = new Date(t + 9 * 60 * 60 * 1000);
    return { w: j.getUTCDay(), h: j.getUTCHours(), m: j.getUTCMinutes() };
  }

  function getSession(){
    var p = jstParts();
    var w = p.w, n = p.h * 60 + p.m;
    var pmEnd    = (w===6) ? toMin('16:00') : toMin('17:00');
    var pmEndStr = (w===6) ? '16:00' : '17:00';
    var ctx = { pmEndStr: pmEndStr };
    if(w===0||w===4)         return {t:'hol', ctx:ctx};
    if(n<toMin('08:30'))     return {t:'pre', ctx:ctx};
    if(n<toMin('11:30'))     return {t:'open', half:'am', ctx:ctx};
    if(n<toMin('14:30'))     return {t:'lun', ctx:ctx};
    if(n<pmEnd)              return {t:'open', half:'pm', ctx:ctx};
    return {t:'aft', ctx:ctx};
  }

  function fmtUpdated(iso){
    if(!iso) return '更新 --:--';
    var d = new Date(iso);                // ISO8601 (+09:00 付き) は全ブラウザでパース可
    if(isNaN(d.getTime())) return '更新 --:--';
    var p = jstParts(d.getTime());
    return '更新 '+('0'+p.h).slice(-2)+':'+('0'+p.m).slice(-2);
  }

  function hoursHtml(s){
    var amC = (s.t==='open' && s.half==='am') ? ' is-current' : '';
    var pmC = (s.t==='open' && s.half==='pm') ? ' is-current' : '';
    return '<div class="hours">'
      +'<div class="hours-title">受付時間</div>'
      +'<div class="hours-rows">'
      +'<div class="hours-row'+amC+'"><span class="hours-period">午前</span><span class="hours-time">8:30–11:30</span></div>'
      +'<div class="hours-row'+pmC+'"><span class="hours-period">午後</span><span class="hours-time">14:30–'+s.ctx.pmEndStr+'</span></div>'
      +'</div></div>';
  }

  function render(data){
    var s  = getSession();
    var el = document.getElementById('content');
    var h  = '';

    if(data && data.error){
      h = '<div class="hero">'
        +'<div class="status-badge off">情報を取得できませんでした</div>'
        +'<div class="state-big">しばらくしてから<br>再度ご確認ください</div>'
        +'</div>';
      el.innerHTML = h + hoursHtml(s);
      return;
    }

    // 祝日・臨時休診: クライアント時刻のセッション判定より優先
    if(data && data.is_holiday){
      h = '<div class="hero">'
        +'<div class="status-badge off">休診日</div>'
        +'<div class="state-big">本日は休診日です</div>'
        +'<div class="state-resume-note">またのご来院をお待ちしております</div>'
        +'</div>';
      el.innerHTML = h + hoursHtml(s);
      return;
    }

    switch(s.t){
      case 'hol':
        h = '<div class="hero">'
          +'<div class="status-badge off">休診日</div>'
          +'<div class="state-big">本日は休診日です</div>'
          +'<div class="state-resume-note">診療は月・火・水・金・土曜日に行っております</div>'
          +'</div>';
        break;

      case 'pre':
        h = '<div class="hero">'
          +'<div class="status-badge busy">受付開始前</div>'
          +'<div class="state-resume-label">午前の受付開始</div>'
          +'<div class="state-resume-time">8:30</div>'
          +'<div class="state-resume-note">から受付を開始します</div>'
          +'</div>';
        break;

      case 'lun':
        // 11:30〜14:30: 受付時間外。「本日終了」と誤読されないよう「午前の」を明示。
        h = '<div class="hero">'
          +'<div class="status-badge busy">午前の受付終了</div>'
          +'<div class="state-big">午前の受付は<br>終了いたしました</div>'
          +'</div>';
        break;

      case 'aft':
        h = '<div class="hero">'
          +'<div class="status-badge off">受付終了</div>'
          +'<div class="state-big">本日の受付は<br>終了しました</div>'
          +'<div class="state-resume-note">またのご来院をお待ちしております</div>'
          +'</div>';
        break;

      case 'open':
        // is_open は scraper 取得時刻のフラグで最大5分のラグがある。
        // 8:30 / 14:30 直後の境界では scraper の更新が間に合わず
        // is_open=false のままになることがあるため、
        // その場合は「情報取得中」表示にして "受付時間外" や
        // "お待ちなし" の誤表示を避ける（混雑状況不明と分かるように）。
        if(!data || !data.is_open){
          h = '<div class="hero">'
            +'<div class="status-badge busy">受付中</div>'
            +'<div class="state-big">最新の待ち時間を<br>取得しています</div>'
            +'<div class="state-resume-note">しばらくお待ちください</div>'
            +'</div>';
        } else if(!data.estimated_minutes){
          // is_open=true で estimated_minutes が 0 または未定義 → 真にお待ちなし
          // （直来0でも予約や診察中で estimated>0 なら待ち時間を表示する）
          h = '<div class="hero">'
            +'<div class="status-badge open">受付中</div>'
            +'<div class="no-wait-big">お待ちの方は<br>いません</div>'
            +'<div class="no-wait-sub">比較的スムーズにご案内できます</div>'
            +'</div>';
        } else {
          // 150分を超える場合は「150分以上」表記（具体的な分数の不安感を抑制）
          var isOverMax = data.estimated_minutes > 150;
          var displayNum  = isOverMax ? 150 : data.estimated_minutes;
          var displayUnit = isOverMax ? '分以上' : '分';
          h = '<div class="hero">'
            +'<div class="status-badge busy">受付中</div>'
            +'<div class="hero-label">目安の待ち時間</div>'
            +'<div class="hero-number-row">'
            +'<span class="hero-number">'+displayNum+'</span>'
            +'<span class="hero-unit'+(isOverMax ? ' over' : '')+'">'+displayUnit+'</span>'
            +'</div>'
            +'<div class="hero-desc">程度お待ちいただきます</div>'
            +'</div>';
        }
        break;

      default:
        h = '<div class="hero"><div class="status-badge off">受付時間外です</div></div>';
    }

    el.innerHTML = h + hoursHtml(s);
  }

  function load(){
    fetch(DATA_URL+'?t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        render(d);
        var u = document.getElementById('updated');
        if(u) u.textContent = fmtUpdated(d.updated_at);
      })
      .catch(function(){ render({error:true}); });
  }

  load();
  setInterval(load, INTERVAL);
})();
</script>
</body>
</html>
