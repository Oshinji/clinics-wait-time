<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待ち時間 | みがわ町整形外科クリニック</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #fff;
      border: 2px solid #b3d4f0;
      border-radius: 16px;
      padding: 32px 28px 28px;
      text-align: center;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(21,101,192,.10);
    }
    .label {
      display: inline-block;
      background: #1565c0;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      padding: 5px 18px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #1a3a6e;
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .icon { font-size: 48px; margin-bottom: 10px; }
    .msg-gray { font-size: 22px; font-weight: 700; color: #444; }
    .msg-blue { font-size: 22px; font-weight: 700; color: #1565c0; }
    .sub {
      font-size: 16px;
      color: #666;
      margin-top: 12px;
      line-height: 2.0;
    }
    .sub strong { color: #1a3a6e; }
    .time-label { font-size: 16px; color: #555; margin-bottom: 6px; }
    .time-val {
      font-size: 88px;
      font-weight: 800;
      color: #c0392b;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .time-unit { font-size: 26px; font-weight: 700; color: #c0392b; margin-bottom: 10px; }
    .time-count { font-size: 15px; color: #888; }
    .footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e8f0fb;
      font-size: 13px;
      color: #aaa;
      line-height: 1.8;
    }
    .updated { font-size: 13px; color: #b0bec5; margin-bottom: 3px; }
    .loading { font-size: 16px; color: #b0bec5; padding: 20px 0; }

    /* スマホ縦（～479px）*/
    @media (max-width: 479px) {
      body { padding: 12px; background: #fff; }
      .card {
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 24px 16px 20px;
      }
      .title { font-size: 18px; }
      .msg-gray, .msg-blue { font-size: 20px; }
      .time-val { font-size: 96px; }
    }

    /* 横型タブレット（768px〜） */
    @media (min-width: 768px) {
      .card { padding: 40px 48px 36px; }
      .title { font-size: 22px; }
      .msg-gray, .msg-blue { font-size: 24px; }
      .time-val { font-size: 100px; }
      .time-unit { font-size: 28px; }
      .sub { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">WALK-IN</div>
    <div class="title">予約なしでご来院の方の<br>現在の待ち時間目安</div>
    <div id="body"><div class="loading">読み込み中…</div></div>
    <div class="footer">
      <div class="updated" id="updated"></div>
      ※ 目安であり、診察内容により前後します。
    </div>
  </div>

  <script>
  (function(){
    var URL = "https://raw.githubusercontent.com/Oshinji/clinics-wait-time/main/data/status.json";
    var INTERVAL = 5 * 60 * 1000;

    // 診療時間: 月火水金土 8:30-11:30 / 14:30-17:30 (土のみ〜16:30)、木日休診
    function toMin(s){ var p=s.split(':'); return +p[0]*60+ +p[1]; }
    function getSession(){
      var _d=new Date(), d=new Date(_d.toLocaleString("en-US",{timeZone:"Asia/Tokyo"}));
      var w=d.getDay(), n=d.getHours()*60+d.getMinutes();
      var pmE = (w===6) ? toMin('16:30') : toMin('17:30');
      var hrs = '8:30〜11:30 / 14:30〜'+((w===6)?'16:30':'17:30');
      if(w===0||w===4) return {t:'hol'};
      if(n<toMin('08:30')) return {t:'pre', hrs:hrs};
      if(n<toMin('11:30')) return {t:'open'};
      if(n<toMin('14:30')) return {t:'lun', hrs:hrs};
      if(n<pmE)            return {t:'open'};
      return {t:'aft', hrs:hrs};
    }

    function fmt(iso){
      if(!iso) return '';
      var d=new Date(iso);
      return '最終更新: '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    }

    function render(data){
      var el=document.getElementById('body');
      if(!el) return;
      var s=getSession();

      if(data && data.error){
        el.innerHTML='<div class="icon">⚠️</div><div class="msg-gray">情報を取得できませんでした</div>';
        return;
      }
      if(s.t==='hol'){
        el.innerHTML='<div class="icon">🏥</div><div class="msg-gray">本日は休診日です</div><div class="sub">診療は月・火・水・金・土曜日に行っております</div>';
        return;
      }
      if(s.t==='pre'){
        el.innerHTML='<div class="icon">🕗</div><div class="msg-gray">本日の受付はまだ始まっていません</div><div class="sub">午前の受付開始：<strong>8:30</strong><br>受付時間：'+s.hrs+'</div>';
        return;
      }
      if(s.t==='lun'){
        el.innerHTML='<div class="icon">🍽️</div><div class="msg-gray">只今、お昼休みです</div><div class="sub">午後の受付開始：<strong>14:30</strong><br>受付時間：'+s.hrs+'</div>';
        return;
      }
      if(s.t==='aft'){
        el.innerHTML='<div class="icon">🏥</div><div class="msg-gray">本日の受付は終了しました</div><div class="sub">受付時間：'+s.hrs+'</div>';
        return;
      }
      if(!data||!data.is_open){
        el.innerHTML='<div class="icon">🏥</div><div class="msg-gray">現在受付時間外です</div>';
        return;
      }
      if(data.count===0){
        el.innerHTML='<div class="icon">✅</div><div class="msg-blue">現在 お待ちの方はいません</div><div class="sub">比較的スムーズにご案内できます</div>';
        return;
      }
      el.innerHTML='<div class="time-label">現在の目安待ち時間</div>'
        +'<div class="time-val">'+data.estimated_minutes+'</div>'
        +'<div class="time-unit">分 程度</div>'
        +'<div class="time-count">（予約なし来院の方 '+data.count+'名 が診察をお待ちです）</div>';
    }

    function load(){
      fetch(URL+'?t='+Date.now())
        .then(function(r){return r.json();})
        .then(function(d){
          render(d);
          var u=document.getElementById('updated');
          if(u) u.textContent=fmt(d.updated_at);
        })
        .catch(function(){render({error:true});});
    }

    load();
    setInterval(load, INTERVAL);
  })();
  </script>
</body>
</html>
