<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>呼び出しテストモニター</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a202c; }

    /* 待機画面 */
    #idle {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #718096; text-align: center;
    }
    #idle .title { font-size: 4vw; margin-bottom: 2vh; }
    #idle .desc { font-size: 2vw; line-height: 1.8; }
    #idle .status { font-size: 2vw; margin-top: 4vh; color: #48bb78; }

    /* 呼び出しオーバーレイ（32〜40型・横型モニター向けレイアウト） */
    :root {
      --room1-bright: #68d391;  /* 診察室1: 緑 */
      --room1-deep:   #2f855a;
      --room2-bright: #f6ad55;  /* 診察室2: オレンジ */
      --room2-deep:   #c05621;
    }
    #callOverlay {
      position: absolute; inset: 0;
      background: #0a2540; z-index: 100;
      display: none;
      align-items: center; justify-content: center;
      color: #fff; text-align: center;
    }
    #callOverlay.active { display: flex; }

    .call-main { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .call-main .label { font-size: 7vh; letter-spacing: .3em; color: #a8c5e0; }
    .call-main .number { font-size: 32vh; font-weight: bold; line-height: 1.1; color: #ffe066; }
    .room-line { display: flex; align-items: center; gap: 1.2vw; margin-top: 2vh; }
    /* 横幅からはみ出して折り返さないよう、縦横両方を考慮したサイズにする */
    .room-pill { font-size: min(8vh, 3.4vw); font-weight: bold; padding: 1vh 2vw; border-radius: 3vh; color: #fff; background: #2b6cb0; white-space: nowrap; }
    #callOverlay.room1 .room-pill { background: var(--room1-deep); }
    #callOverlay.room2 .room-pill { background: var(--room2-deep); }
    .room-suffix { font-size: min(7vh, 3vw); font-weight: bold; white-space: nowrap; }

    #soundGate {
      position: absolute; right: 12px; bottom: 12px; z-index: 200;
      font-size: 16px; padding: 10px 18px; border: none; border-radius: 8px;
      background: rgba(255, 255, 255, .85); color: #333; cursor: pointer;
      display: none;
    }
    #soundGate.visible { display: block; }
    /* GoogleTV等リモコンのD-padでフォーカスが分かるように強調表示する */
    #soundGate:focus {
      outline: 4px solid #4299e1; outline-offset: 2px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="idle">
    <div class="title">🧪 呼び出しテストモニター</div>
    <div class="desc">
      このページはテスト専用です。運用中のモニターには影響しません。<br>
      call.html?test=1 から呼び出しを送ると、ここに本番と同じ表示が出ます。<br>
      （テストモードの呼び出しは本番モニターには表示されません）
    </div>
    <div class="status" id="connStatus">接続中…</div>
  </div>

  <div id="callOverlay">
    <div class="call-main">
      <div class="label">整理番号</div>
      <div class="number" id="callNumber">--</div>
      <div class="room-line"><span class="room-pill" id="callRoom"></span><span class="room-suffix">へお入りください</span></div>
    </div>
  </div>
  <button id="soundGate" tabindex="0" autofocus>🔇 タッチ／決定ボタンで音声を有効にする</button>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const CALL_DISPLAY_SECONDS = 30;
    const CALL_MAX_AGE_MS = 2 * 60 * 1000;

    firebase.initializeApp(window.FIREBASE_CONFIG);
    const cdb = firebase.database();

    const overlay = document.getElementById('callOverlay');
    const callNumberEl = document.getElementById('callNumber');
    const callRoomEl = document.getElementById('callRoom');
    const soundGate = document.getElementById('soundGate');
    const connStatus = document.getElementById('connStatus');

    let hideTimer = null;
    let audioCtx = null;
    let soundEnabled = false;

    // Chromeは音声リストの読み込みが非同期で、リスト確定前の発話が無音になる端末があるため
    // 日本語音声を明示的に選んで指定する
    let jaVoice = null;
    function pickVoice() {
      if (!window.speechSynthesis) return;
      const vs = speechSynthesis.getVoices();
      jaVoice = vs.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf('ja') === 0; }) || null;
    }
    if (window.speechSynthesis) {
      pickVoice();
      speechSynthesis.onvoiceschanged = pickVoice;
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      if (jaVoice) u.voice = jaVoice;
      u.rate = 0.9;
      u.volume = 1;
      speechSynthesis.speak(u);
    }

    // ---------- 音声ファイル再生 ----------
    // GoogleTV等のブラウザには日本語TTSエンジンがなく Web Speech API が無音になるため、
    // edge-tts で事前生成した音声ファイル(audio/)を WebAudio で連結再生する方式を主とし、
    // ファイルが無い場合のみ TTS にフォールバックする
    const AUDIO_BASE = 'audio/';
    const audioBuffers = {};
    let activeSources = [];

    function loadBuffer(key, file) {
      if (audioBuffers[key]) return Promise.resolve(audioBuffers[key]);
      return fetch(AUDIO_BASE + file).then(function(r) {
        if (!r.ok) throw new Error(file + ': ' + r.status);
        return r.arrayBuffer();
      }).then(function(ab) {
        return new Promise(function(res, rej) { audioCtx.decodeAudioData(ab, res, rej); });
      }).then(function(buf) { audioBuffers[key] = buf; return buf; });
    }

    function stopAudio() {
      activeSources.forEach(function(s) { try { s.stop(); } catch (e) {} });
      activeSources = [];
    }

    function playSequence(bufs, startAt) {
      let t = startAt;
      bufs.forEach(function(b) {
        const s = audioCtx.createBufferSource();
        s.buffer = b;
        s.connect(audioCtx.destination);
        s.start(t);
        activeSources.push(s);
        t += b.duration + 0.1;
      });
      return t;
    }

    function enableSound() {
      if (soundEnabled) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      soundEnabled = true;
      soundGate.classList.remove('visible');
      clearInterval(focusWatchdog);
      // 動作確認を兼ねてチャイム＋確認音声を実際に鳴らす
      playChime();
      loadBuffer('ready', 'ready.mp3').then(function(b) {
        playSequence([b], audioCtx.currentTime + 0.9);
      }).catch(function() {
        speak('音声の準備ができました');
      });
      // 呼び出しで毎回使うパーツを先読みしておく
      loadBuffer('prefix', 'prefix.mp3').catch(function(){});
      loadBuffer('room1', 'room1.mp3').catch(function(){});
      loadBuffer('room2', 'room2.mp3').catch(function(){});
    }

    soundGate.classList.add('visible');
    soundGate.addEventListener('click', enableSound);
    // GoogleTV等のリモコンは「決定(OK)」ボタン押下時にEnter/Spaceのkeydownとして
    // 届く場合があり、ブラウザによってはボタンのネイティブclick変換が効かないことがあるため
    // 保険としてkeydownでも同じ処理を発火させる
    soundGate.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) {
        e.preventDefault();
        enableSound();
      }
    });

    // リモコン操作はフォーカスが当たっている要素にしか反応しないため、
    // ページ内で唯一操作が必要なこのボタンに確実にフォーカスを当てておく
    function focusSoundGate() {
      if (!soundEnabled && soundGate.classList.contains('visible')) soundGate.focus();
    }
    focusSoundGate();
    setTimeout(focusSoundGate, 300);
    window.addEventListener('focus', focusSoundGate);
    // 音声有効化が済むまで、何らかの理由でフォーカスが外れても定期的に戻す
    const focusWatchdog = setInterval(focusSoundGate, 2000);

    function playChime() {
      if (!audioCtx) return;
      const notes = [[659.25, 0, .45], [523.25, .45, .7]];
      notes.forEach(function(n) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = n[0];
        const t0 = audioCtx.currentTime + n[1];
        gain.gain.setValueAtTime(.5, t0);
        gain.gain.exponentialRampToValueAtTime(.001, t0 + n[2]);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + n[2]);
      });
    }

    function speakCall(number, room) {
      if (!soundEnabled) return;
      const roomKey = (room === 2) ? 'room2' : 'room1';
      Promise.all([
        loadBuffer('prefix', 'prefix.mp3'),
        loadBuffer('num' + number, 'num/' + number + '.mp3'),
        loadBuffer(roomKey, roomKey + '.mp3'),
      ]).then(function(bufs) {
        stopAudio();
        const end1 = playSequence(bufs, audioCtx.currentTime + 0.05);
        playSequence(bufs, end1 + 0.7);   // 2回読み上げ
      }).catch(function(e) {
        // 音声ファイルが無い番号(301以上)などはTTSへ(TTS非搭載端末では無音になる)
        if (!window.speechSynthesis) return;
        // 「お入りください」は音声合成が「おいりください」と誤読するため、ひらがなで指定する
        const text = '整理番号、' + number + '番のかた、第' + room + '診察室へ、おはいりください。';
        speechSynthesis.cancel();
        speak(text);
        speak(text);
      });
    }

    function showCall(number, room) {
      callNumberEl.textContent = number;
      callRoomEl.textContent = '第' + room + '診察室';
      // room1/room2クラスは診察室名バッジの色分けに使用
      overlay.classList.remove('room1', 'room2');
      if (room === 1) overlay.classList.add('room1');
      else if (room === 2) overlay.classList.add('room2');
      overlay.classList.add('active');
      playChime();
      setTimeout(function() { speakCall(number, room); }, 900);
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideCall, CALL_DISPLAY_SECONDS * 1000);
    }

    function hideCall() {
      overlay.classList.remove('active');
      clearTimeout(hideTimer);
      // 取消時は読み上げ途中でも止める
      stopAudio();
      if (window.speechSynthesis) speechSynthesis.cancel();
    }

    // テスト専用パス call/test を監視（本番の call/current には触れない）
    let lastTs = 0;
    cdb.ref('call/test').on('value', function(snap) {
      connStatus.textContent = '✅ 接続OK（呼び出し待機中）';
      const v = snap.val();
      if (!v || !v.ts) return;
      if (v.ts === lastTs) return;
      const age = Date.now() - v.ts;
      if (age > CALL_MAX_AGE_MS) return;
      lastTs = v.ts;
      if (v.action === 'call' && v.number) {
        showCall(v.number, v.room || 1);
      } else if (v.action === 'cancel') {
        hideCall();
      }
    }, function(err) {
      connStatus.textContent = '⚠️ 接続エラー：' + err.message;
      connStatus.style.color = '#fc8181';
    });
  </script>
</body>
</html>
