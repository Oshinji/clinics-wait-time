<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ローテーター</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #frame, #image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #frame { border: none; }
    #image { object-fit: contain; display: none; }
  </style>
</head>
<body>
  <iframe id="frame"></iframe>
  <img id="image" alt="">

  <script>
    // =============================================
    // ここを編集してローテーション内容を設定します
    // type: 'url'  → HTMLページ（iframeで表示）
    // type: 'image'→ 画像ファイル（全画面で表示）
    // seconds      → この項目を表示する秒数
    // =============================================
    const items = [
      { type: 'url',   src: 'https://oshinji.github.io/clinics-wait-time/split.html',       seconds: 15 },
      { type: 'image', src: 'https://oshinji.github.io/clinics-wait-time/yoyaku-yusen.png', seconds: 10 },
    ];
    // =============================================

    const frame = document.getElementById('frame');
    const image = document.getElementById('image');
    let current = 0;

    function show(index) {
      const item = items[index];
      // src は同じ値でも再代入すると再読み込みが走るため、変わったときだけ代入する。
      // iframe は display:none 中も生きており、中のページが自前で5分ごとに更新する。
      if (item.type === 'image') {
        frame.style.display = 'none';
        image.style.display = 'block';
        if (image.src !== item.src) image.src = item.src;
      } else {
        image.style.display = 'none';
        frame.style.display = 'block';
        if (frame.src !== item.src) frame.src = item.src;
      }
    }

    function next() {
      current = (current + 1) % items.length;
      show(current);
      clearTimeout(timer);
      timer = setTimeout(next, items[current].seconds * 1000);
    }

    show(current);
    var timer = setTimeout(next, items[current].seconds * 1000);
  </script>
</body>
</html>
