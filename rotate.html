<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ローテーター</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #frame, #image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #frame { border: none; }
    #image { object-fit: contain; display: none; }

    /* ---------- 患者呼び出しオーバーレイ ---------- */
    #callOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a2540; z-index: 100;
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: #fff; text-align: center;
    }
    #callOverlay.active { display: flex; }
    #callOverlay .label { font-size: 6vw; margin-bottom: 2vh; letter-spacing: .1em; }
    #callOverlay .number {
      font-size: 22vw; font-weight: bold; line-height: 1.1;
      color: #ffe066;
    }
    #callOverlay .room { font-size: 7vw; margin-top: 2vh; }
    #callOverlay .note { font-size: 3.5vw; margin-top: 4vh; color: #a8c5e0; }

    /* 音声有効化ボタン（起動後1回だけ押す） */
    #soundGate {
      position: absolute; right: 12px; bottom: 12px; z-index: 200;
      font-size: 16px; padding: 10px 18px; border: none; border-radius: 8px;
      background: rgba(255, 255, 255, .85); color: #333; cursor: pointer;
      display: none;
    }
    #soundGate.visible { display: block; }
  </style>
</head>
<body>
  <iframe id="frame"></iframe>
  <img id="image" alt="">

  <div id="callOverlay">
    <div class="label">診察券番号</div>
    <div class="number" id="callNumber">--</div>
    <div class="room" id="callRoom"></div>
    <div class="note">診察室へお入りください</div>
  </div>
  <button id="soundGate">🔇 タッチして音声を有効にする</button>

  <script>
    // =============================================
    // ここを編集してローテーション内容を設定します
    // type: 'url'  → HTMLページ（iframeで表示）
    // type: 'image'→ 画像ファイル（全画面で表示）
    // seconds      → この項目を表示する秒数
    // =============================================
    const items = [
      { type: 'url',   src: 'https://oshinji.github.io/clinics-wait-time/split.html',       seconds: 15 },
      { type: 'image', src: 'https://oshinji.github.io/clinics-wait-time/yoyaku-yusen.png', seconds: 10 },
    ];
    // =============================================

    const frame = document.getElementById('frame');
    const image = document.getElementById('image');
    let current = 0;

    function show(index) {
      const item = items[index];
      // src は同じ値でも再代入すると再読み込みが走るため、変わったときだけ代入する。
      // iframe は display:none 中も生きており、中のページが自前で5分ごとに更新する。
      if (item.type === 'image') {
        frame.style.display = 'none';
        image.style.display = 'block';
        if (image.src !== item.src) image.src = item.src;
      } else {
        image.style.display = 'none';
        frame.style.display = 'block';
        if (frame.src !== item.src) frame.src = item.src;
      }
    }

    function next() {
      current = (current + 1) % items.length;
      show(current);
      clearTimeout(timer);
      timer = setTimeout(next, items[current].seconds * 1000);
    }

    show(current);
    var timer = setTimeout(next, items[current].seconds * 1000);
  </script>

  <!-- ---------- 患者呼び出し機能 ---------- -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // =============================================
    // 呼び出し表示の設定
    // =============================================
    const CALL_DISPLAY_SECONDS = 30;   // 呼出表示を出し続ける秒数
    const CALL_MAX_AGE_MS = 2 * 60 * 1000; // これより古い呼出データは無視（ページ再読込時の再表示防止）
    // =============================================

    firebase.initializeApp(window.FIREBASE_CONFIG);
    const cdb = firebase.database();

    const overlay = document.getElementById('callOverlay');
    const callNumberEl = document.getElementById('callNumber');
    const callRoomEl = document.getElementById('callRoom');
    const soundGate = document.getElementById('soundGate');

    let hideTimer = null;
    let audioCtx = null;
    let soundEnabled = false;

    // ---- 音声有効化（ブラウザの自動再生制限のため、起動後に1回タッチが必要）----
    soundGate.classList.add('visible');
    soundGate.addEventListener('click', function() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // 無音を一度再生して speechSynthesis も解錠する
      const u = new SpeechSynthesisUtterance('');
      speechSynthesis.speak(u);
      soundEnabled = true;
      soundGate.classList.remove('visible');
    });

    // ---- チャイム音（ピンポーン）----
    function playChime() {
      if (!audioCtx) return;
      const notes = [[659.25, 0, .45], [523.25, .45, .7]]; // E5 → C5
      notes.forEach(function(n) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = n[0];
        const t0 = audioCtx.currentTime + n[1];
        gain.gain.setValueAtTime(.5, t0);
        gain.gain.exponentialRampToValueAtTime(.001, t0 + n[2]);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + n[2]);
      });
    }

    // ---- 音声読み上げ ----
    function speakCall(number, room) {
      if (!soundEnabled) return;
      const text = '診察券番号、' + number + '番のかた、第' + room + '診察室へ、お入りください。';
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.9;
      speechSynthesis.speak(u);
      const u2 = new SpeechSynthesisUtterance(text); // 2回読み上げ
      u2.lang = 'ja-JP';
      u2.rate = 0.9;
      speechSynthesis.speak(u2);
    }

    function showCall(number, room) {
      callNumberEl.textContent = number;
      callRoomEl.textContent = '第' + room + '診察室';
      overlay.classList.add('active');
      playChime();
      // チャイムの後に読み上げ
      setTimeout(function() { speakCall(number, room); }, 900);
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideCall, CALL_DISPLAY_SECONDS * 1000);
    }

    function hideCall() {
      overlay.classList.remove('active');
      clearTimeout(hideTimer);
    }

    // ---- Firebase の呼出データを監視 ----
    let lastTs = 0;
    cdb.ref('call/current').on('value', function(snap) {
      const v = snap.val();
      if (!v || !v.ts) return;
      if (v.ts === lastTs) return;           // 同一イベントの重複発火防止
      const age = Date.now() - v.ts;
      if (age > CALL_MAX_AGE_MS) return;     // 古いデータは無視
      lastTs = v.ts;
      if (v.action === 'call' && v.number) {
        showCall(v.number, v.room || 1);
      } else if (v.action === 'cancel') {
        hideCall();
      }
    });
  </script>
</body>
</html>
