<div id="mw-widget"><div class="mw-card"><div class="mw-label">WALK-IN</div><div class="mw-title">予約なしでご来院の方の<br>現在の待ち時間目安</div><div id="mw-body"><div class="mw-loading">読み込み中&#8230;</div></div><div class="mw-footer"><div id="mw-updated"></div>※ 目安であり、診察内容により前後します。約15分ごとに自動更新されます。</div></div></div>
<script>
!function(){
var G="https://raw.githubusercontent.com/Oshinji/clinics-wait-time/main/data/status.json";
var s=document.createElement("style");
s.textContent="#mw-widget{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;max-width:560px;margin:8px auto 24px}#mw-widget .mw-card{background:#fff;border:2px solid #b3d4f0;border-radius:12px;padding:28px 32px;text-align:center;box-shadow:0 2px 12px rgba(21,101,192,.08)}#mw-widget .mw-label{display:inline-block;background:#1565c0;color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;padding:3px 14px;border-radius:20px;margin-bottom:14px}#mw-widget .mw-title{font-size:17px;font-weight:700;color:#1a3a6e;margin-bottom:20px;line-height:1.6}#mw-widget .mw-icon{font-size:40px;margin-bottom:10px}#mw-widget .mw-gray{font-size:17px;font-weight:700;color:#555}#mw-widget .mw-blue{font-size:18px;font-weight:700;color:#1565c0}#mw-widget .mw-sub{font-size:13px;color:#888;margin-top:8px;line-height:1.8}#mw-widget .mw-tv{font-size:60px;font-weight:800;color:#c0392b;line-height:1}#mw-widget .mw-tu{font-size:20px;font-weight:700;color:#c0392b;margin-bottom:8px}#mw-widget .mw-tc{font-size:12px;color:#888}#mw-widget .mw-tl{font-size:13px;color:#555;margin-bottom:4px}#mw-widget .mw-footer{margin-top:18px;padding-top:14px;border-top:1px solid #e8f0fb;font-size:11px;color:#bbb;line-height:1.7}#mw-widget .mw-loading{font-size:14px;color:#b0bec5;padding:16px 0}";
document.head.appendChild(s);
function m(t){var p=t.split(":");return +p[0]*60+ +p[1];}
function sess(){
  var d=new Date(),w=d.getDay(),n=d.getHours()*60+d.getMinutes();
  var h="8:30～11:30 / 14:30～"+((w===6)?"16:30":"17:30");
  if(w===0||w===4)return{t:"hol"};
  if(n<m("08:30"))return{t:"pre",h:h};
  if(n<m("11:30"))return{t:"open"};
  if(n<m("14:30"))return{t:"lun",h:h};
  if(n<(w===6?m("16:30"):m("17:30")))return{t:"open"};
  return{t:"aft",h:h};
}
function show(d){
  var e=document.getElementById("mw-body");
  if(!e)return;
  var sv=sess();
  if(d&&d.error){e.innerHTML='<div class="mw-icon">&#9888;</div><div class="mw-gray">情報を取得できませんでした</div>';return;}
  if(sv.t==="hol"){e.innerHTML='<div class="mw-icon">&#127973;</div><div class="mw-gray">本日は休診日です</div><div class="mw-sub">診療は月・火・水・金・土曜日に行っております</div>';return;}
  if(sv.t==="pre"){e.innerHTML='<div class="mw-icon">&#128343;</div><div class="mw-gray">本日の受付はまだ始まっていません</div><div class="mw-sub">午前の受付開始：<strong>8:30</strong><br>受付時間：'+sv.h+'</div>';return;}
  if(sv.t==="lun"){e.innerHTML='<div class="mw-icon">&#127373;</div><div class="mw-gray">只今、お昼休みです</div><div class="mw-sub">午後の受付開始：<strong>14:30</strong><br>受付時間：'+sv.h+'</div>';return;}
  if(sv.t==="aft"){e.innerHTML='<div class="mw-icon">&#127973;</div><div class="mw-gray">本日の受付は終了しました</div><div class="mw-sub">受付時間：'+sv.h+'</div>';return;}
  if(!d||!d.is_open){e.innerHTML='<div class="mw-icon">&#127973;</div><div class="mw-gray">現在受付時間外です</div>';return;}
  if(d.count===0){e.innerHTML='<div class="mw-icon">&#9989;</div><div class="mw-blue">現在 お待ちの方はいません</div><div class="mw-sub">比較的スムーズにご案内できます</div>';return;}
  e.innerHTML='<div class="mw-tl">現在の目安待ち時間</div><div class="mw-tv">'+d.estimated_minutes+'</div><div class="mw-tu">分 程度</div><div class="mw-tc">（予約なし来院の方 '+d.count+'名 が診察をお待ちです）</div>';
}
function load(){
  fetch(G+"?t="+Date.now()).then(function(r){return r.json();}).then(function(d){
    show(d);
    var u=document.getElementById("mw-updated");
    if(u&&d.updated_at){var dt=new Date(d.updated_at);u.textContent="最終更新: "+("0"+dt.getHours()).slice(-2)+":"+("0"+dt.getMinutes()).slice(-2);}
  }).catch(function(){show({error:true});});
}
load();setInterval(load,900000);
}();
</script>
