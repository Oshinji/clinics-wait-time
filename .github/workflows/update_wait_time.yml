name: 待ち時間を更新

on:
  schedule:
    # GitHub Actions の schedule は遅延が大きいためバックアップ用途
    # 実運用は cron-job.org から workflow_dispatch で10〜15分ごとに叩く
    # 木曜(JST)は休診のためスケジュール対象外
    #   UTC Wed 23:xx = JST Thu 08:xx → weekday 3 を除外
    #   UTC Thu 0-8   = JST Thu 09-17 → weekday 4 を除外
    - cron: '*/15 23 * * 0-2,4-5'   # JST 8:xx（月火水金土）
    - cron: '*/15 0-8 * * 1-3,5-6'  # JST 9:00〜17:45（月火水金土）
  workflow_dispatch:               # 手動実行 / 外部cronからのトリガー

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    # ハング対策：5分で強制停止（通常は1分強で完了する）
    # これがないとハング時に次の run が走らず数時間更新が止まるリスク
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-scraper.txt

      - name: 依存パッケージをインストール
        run: pip install -r requirements-scraper.txt

      # Chromium のインストールは1分以上かかるうえ、実際にスクレイピングするのは
      # 診察窓内（平日 8:30-13:00 / 14:30-19:00）だけ。
      # 外部cron(cron-job.org)が24時間叩いてくるため、窓外ではここを丸ごと省略する。
      # 判定は scraper.py の is_exam_window() と同一ロジック。
      - name: 診察時間内かを判定
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, time as dt_time, timezone, timedelta
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          try:
              holidays = json.load(open("data/holidays.json", encoding="utf-8"))
          except Exception:
              holidays = {}
          closed = set(holidays.get("closed", []))
          special = holidays.get("special_hours", {}).get(now.strftime("%Y-%m-%d"))
          wd, t = now.weekday(), now.time()

          def hm(s):
              h, m = s.split(":")
              return dt_time(int(h), int(m))

          if special:
              # 臨時受付時間: am_end で午前終了を上書き（+90分は残存診察のバッファ）、
              # pm が false でなければ通常のPM窓(14:30-19:00)も対象にする
              am_end = hm(special["am_end"]) if special.get("am_end") else dt_time(11, 30)
              am_end_min = am_end.hour * 60 + am_end.minute
              t_min = t.hour * 60 + t.minute
              in_am = 8 * 60 + 30 <= t_min < am_end_min + 90
              in_pm = special.get("pm", False) is not False and (dt_time(14, 30) <= t < dt_time(19, 0))
              in_window = (now.strftime("%Y-%m-%d") not in closed) and wd not in (3, 6) and (in_am or in_pm)
          else:
              in_window = (
                  now.strftime("%Y-%m-%d") not in closed
                  and wd not in (3, 6)
                  and ((dt_time(8, 30) <= t < dt_time(13, 0))
                       or (dt_time(14, 30) <= t < dt_time(19, 0)))
              )
          print(f"open={'true' if in_window else 'false'}")
          PY

      - name: Chromium をインストール（診察時間内のみ）
        if: steps.window.outputs.open == 'true'
        run: playwright install chromium --with-deps

      - name: スクレイパーを実行
        env:
          CLINICS_EMAIL:    ${{ secrets.CLINICS_EMAIL }}
          CLINICS_PASSWORD: ${{ secrets.CLINICS_PASSWORD }}
          MINUTES_PER_PATIENT: ${{ vars.MINUTES_PER_PATIENT || '15' }}
          TZ: Asia/Tokyo
        run: python scraper.py

      - name: デバッグスクショをアップロード（常時）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: "debug_*"
          retention-days: 3
          if-no-files-found: ignore

      - name: data/status.json をコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          git diff --staged --quiet || git commit -m "chore: 待ち時間を更新 [skip ci]"
          git pull --rebase origin main
          git push
