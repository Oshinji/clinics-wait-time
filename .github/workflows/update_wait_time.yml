name: 待ち時間を更新

on:
  schedule:
    # GitHub Actions の schedule は遅延が大きいためバックアップ用途
    # 実運用は cron-job.org から workflow_dispatch で10〜15分ごとに叩く
    # 木曜(JST)は休診のためスケジュール対象外
    #   UTC Wed 23:xx = JST Thu 08:xx → weekday 3 を除外
    #   UTC Thu 0-8   = JST Thu 09-17 → weekday 4 を除外
    - cron: '*/15 23 * * 0-2,4-5'   # JST 8:xx（月火水金土）
    - cron: '*/15 0-8 * * 1-3,5-6'  # JST 9:00〜17:45（月火水金土）
  workflow_dispatch:               # 手動実行 / 外部cronからのトリガー

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    # ハング対策：5分で強制停止（通常は1分強で完了する）
    # これがないとハング時に次の run が走らず数時間更新が止まるリスク
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-scraper.txt

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements-scraper.txt
          playwright install chromium --with-deps

      - name: スクレイパーを実行
        env:
          CLINICS_EMAIL:    ${{ secrets.CLINICS_EMAIL }}
          CLINICS_PASSWORD: ${{ secrets.CLINICS_PASSWORD }}
          MINUTES_PER_PATIENT: ${{ vars.MINUTES_PER_PATIENT || '15' }}
          TZ: Asia/Tokyo
        run: python scraper.py

      - name: デバッグスクショをアップロード（常時）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: "debug_*"
          retention-days: 3
          if-no-files-found: ignore

      - name: data/status.json をコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          git diff --staged --quiet || git commit -m "chore: 待ち時間を更新 [skip ci]"
          git pull --rebase origin main
          git push
