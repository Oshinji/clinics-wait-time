name: 待ち時間を更新

on:
  schedule:
    # GitHub Actions の schedule は遅延が大きいためバックアップ用途
    # 実運用は cron-job.org から workflow_dispatch で10〜15分ごとに叩く
    - cron: '*/15 23 * * 0-5'    # JST 8:xx（月〜土）
    - cron: '*/15 0-8 * * 1-6'   # JST 9:00〜17:45（月〜土）
  workflow_dispatch:               # 手動実行 / 外部cronからのトリガー

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: スクレイパーを実行
        env:
          CLINICS_EMAIL:    ${{ secrets.CLINICS_EMAIL }}
          CLINICS_PASSWORD: ${{ secrets.CLINICS_PASSWORD }}
          MINUTES_PER_PATIENT: ${{ vars.MINUTES_PER_PATIENT || '15' }}
          OPEN_HOUR:  '8'
          CLOSE_HOUR: '18'
          TZ: Asia/Tokyo
        run: python scraper.py

      - name: デバッグスクショをアップロード（常時）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: "debug_*.png"
          retention-days: 3
          if-no-files-found: ignore

      - name: data/status.json をコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          git diff --staged --quiet || git commit -m "chore: 待ち時間を更新 [skip ci]"
          git pull --rebase origin main
          git push
